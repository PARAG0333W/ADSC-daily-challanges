<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Counter App</title>
  <style>
    :root {
      --bg-dark: #0f0f0f;
      --card-dark: #1c1c1e;
      --text-dark: #ffffff;
      --btn-dark: #2a2a2a;
      --hover-dark: #333;

      --bg-light: #f5f5f5;
      --card-light: #ffffff;
      --text-light: #222;
      --btn-light: #e0e0e0;
      --hover-light: #ccc;

      --accent: #00ffb3;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.3s ease;
      font-family: 'Segoe UI', sans-serif;
    }

    .dark-mode {
      background: var(--bg-dark);
      color: var(--text-dark);
    }

    .light-mode {
      background: var(--bg-light);
      color: var(--text-light);
    }

    .counter-box {
      padding: 40px 60px;
      border-radius: 16px;
      text-align: center;
      transition: 0.3s ease;
      box-shadow: 0 0 30px rgba(0, 255, 179, 0.2);
    }

    .dark-mode .counter-box {
      background: var(--card-dark);
    }

    .light-mode .counter-box {
      background: var(--card-light);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: var(--accent);
    }

    .count {
      font-size: 5rem;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      font-size: 1.2rem;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dark-mode button {
      background-color: var(--btn-dark);
      color: var(--text-dark);
    }

    .light-mode button {
      background-color: var(--btn-light);
      color: var(--text-light);
    }

    .dark-mode button:hover {
      background-color: var(--hover-dark);
      border-color: var(--accent);
      color: var(--accent);
    }

    .light-mode button:hover {
      background-color: var(--hover-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    .toggle-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.5rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent);
    }

    @media (max-width: 500px) {
      .counter-box {
        padding: 30px 20px;
      }

      .count {
        font-size: 3.5rem;
      }

      button {
        padding: 10px 18px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body class="dark-mode">
  <button class="toggle-btn" onclick="toggleMode()">🌙</button>

  <div class="counter-box">
    <h1>Modern Counter</h1>
    <div class="count" id="count">0</div>
    <div class="buttons">
      <button onclick="playSound(); decrement()">−</button>
      <button onclick="playSound(); reset()">Reset</button>
      <button onclick="playSound(); increment()">+</button>
    </div>
  </div>

  <audio id="clickSound" src="https://www.fesliyanstudios.com/play-mp3/387"></audio>

  <script>
    let count = 0;
    let isDark = true;

    function updateDisplay() {
      document.getElementById("count").innerText = count;
    }

    function increment() {
      count++;
      updateDisplay();
    }

    function decrement() {
      count--;
      updateDisplay();
    }

    function reset() {
      count = 0;
      updateDisplay();
    }

    function toggleMode() {
      const body = document.body;
      const toggleBtn = document.querySelector(".toggle-btn");
      isDark = !isDark;
      if (isDark) {
        body.className = "dark-mode";
        toggleBtn.innerText = "🌙";
      } else {
        body.className = "light-mode";
        toggleBtn.innerText = "☀️";
      }
    }

    function playSound() {
      const sound = document.getElementById("clickSound");
      sound.currentTime = 0;
      sound.play();
    }
  </script>
</body>
</html>
